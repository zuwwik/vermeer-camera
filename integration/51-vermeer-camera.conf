# Native PipeWire applications use libcamera directly. Keep the compatibility
# webcam for V4L2 clients, without listing the same sensor twice in PipeWire.
monitor.v4l2.rules = [
  {
    matches = [
      {
        api.v4l2.path = "/dev/video42"
        api.v4l2.cap.driver = "v4l2 loopback"
      }
      { api.v4l2.path = "/dev/video43" api.v4l2.cap.driver = "v4l2 loopback" }
      { api.v4l2.path = "/dev/video44" api.v4l2.cap.driver = "v4l2 loopback" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]

monitor.libcamera.rules = [
  {
    matches = [ { node.name = "~libcamera_input.*" } ]
    actions = {
      update-props = {
        node.pause-on-idle = true
        session.suspend-timeout-seconds = 1
      }
    }
  }
]
